<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>lumen · 交互原型</title>
<style>
/* ============ 基础 ============ */
* { margin:0; padding:0; box-sizing:border-box; }
:root{
  --bg:#f4f5f7; --panel:#ffffff; --panel2:#f8f9fb; --border:#e4e7ec; --border-strong:#d0d5dd;
  --text:#1d2129; --muted:#6b7280; --faint:#98a2b3;
  --accent:#4f46e5; --accent-hover:#4338ca; --accent-soft:#eef2ff; --accent-border:#c7d2fe;
  --ok:#059669; --ok-soft:#d1fae5; --warn:#b45309; --warn-soft:#fef3c7; --danger:#dc2626; --danger-soft:#fee2e2;
  --radius:10px; --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
  --mono:"SF Mono",ui-monospace,Menlo,Consolas,monospace;
}
[data-theme="dark"]{
  --bg:#0f1115; --panel:#171a21; --panel2:#1d212b; --border:#2a2f3a; --border-strong:#3a4150;
  --text:#e4e7ec; --muted:#9aa3b2; --faint:#6b7280;
  --accent:#818cf8; --accent-hover:#a5b4fc; --accent-soft:#232840; --accent-border:#3b4270;
  --ok:#34d399; --ok-soft:#14352a; --warn:#fbbf24; --warn-soft:#3a2f10; --danger:#f87171; --danger-soft:#3d1a1a;
  --shadow:0 1px 2px rgba(0,0,0,.3);
}
html,body{height:100%;}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.6;}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit;}
input,select,textarea{font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--border-strong);border-radius:8px;padding:7px 10px;outline:none;}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
::-webkit-scrollbar{width:8px;height:8px;}::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:4px;}

/* ============ 布局 ============ */
.topbar{height:52px;background:var(--panel);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;padding:0 16px;position:sticky;top:0;z-index:50;}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;}
.logo-mark{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,var(--accent),#7c3aed);display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:800;}
.search{flex:1;max-width:420px;display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;color:var(--faint);}
.search input{border:none;background:none;flex:1;padding:0;}
.search input:focus{box-shadow:none;}
kbd{font-family:var(--mono);font-size:11px;background:var(--panel);border:1px solid var(--border-strong);border-bottom-width:2px;border-radius:5px;padding:1px 5px;color:var(--muted);}
.app{display:flex;height:calc(100vh - 52px);}
.rail{width:196px;background:var(--panel);border-right:1px solid var(--border);padding:12px 10px;flex-shrink:0;overflow-y:auto;}
.rail-group{font-size:11px;color:var(--faint);padding:10px 8px 4px;letter-spacing:.05em;}
.rail-btn{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:8px;color:var(--muted);font-size:13.5px;text-align:left;}
.rail-btn:hover{background:var(--panel2);color:var(--text);}
.rail-btn.active{background:var(--accent-soft);color:var(--accent);font-weight:600;}
.rail-btn .ico{width:20px;text-align:center;}
.rail-btn .badge{margin-left:auto;font-size:11px;background:var(--accent-soft);color:var(--accent);border-radius:9px;padding:1px 7px;}
.main{flex:1;overflow-y:auto;padding:22px 26px;}
.page-head{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap;}
.page-head h1{font-size:19px;font-weight:700;}
.page-head .sub{color:var(--muted);font-size:13px;}
.page-head .spacer{flex:1;}

/* ============ 组件 ============ */
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);}
.card-pad{padding:16px;}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:8px;border:1px solid var(--border-strong);background:var(--panel);font-size:13px;color:var(--text);transition:.15s;}
.btn:hover{border-color:var(--accent);color:var(--accent);}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff;}
.btn-primary:hover{background:var(--accent-hover);color:#fff;}
.btn-ghost{border-color:transparent;color:var(--muted);}
.btn-ghost:hover{background:var(--panel2);color:var(--text);}
.btn-danger:hover{border-color:var(--danger);color:var(--danger);}
.btn-sm{padding:4px 9px;font-size:12px;border-radius:6px;}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;padding:2px 8px;border-radius:99px;background:var(--panel2);border:1px solid var(--border);color:var(--muted);}
.tag.accent{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-border);}
.tag.ok{background:var(--ok-soft);color:var(--ok);}
.tag.warn{background:var(--warn-soft);color:var(--warn);}
.tag.danger{background:var(--danger-soft);color:var(--danger);}
.qtype{font-size:11.5px;padding:2px 8px;border-radius:6px;font-weight:600;}
.qtype.single{background:#e0e7ff;color:#3730a3;}.qtype.multi{background:#ccfbf1;color:#0f766e;}
.qtype.judge{background:#fef9c3;color:#a16207;}.qtype.fill{background:#fce7f3;color:#be185d;}
.qtype.short,.qtype.calc,.qtype.essay{background:#ede9fe;color:#5b21b6;}
[data-theme="dark"] .qtype.single{background:#2a2f55;color:#a5b4fc;}[data-theme="dark"] .qtype.multi{background:#0f3a35;color:#5eead4;}
[data-theme="dark"] .qtype.judge{background:#3a3413;color:#fde047;}[data-theme="dark"] .qtype.fill{background:#3d1a2e;color:#f9a8d4;}
[data-theme="dark"] .qtype.short,[data-theme="dark"] .qtype.calc,[data-theme="dark"] .qtype.essay{background:#2a2140;color:#c4b5fd;}
.stars{color:#f59e0b;letter-spacing:1px;font-size:12px;}
table{width:100%;border-collapse:collapse;}
th{font-size:12px;color:var(--muted);font-weight:500;text-align:left;padding:9px 12px;border-bottom:1px solid var(--border);}
td{padding:11px 12px;border-bottom:1px solid var(--border);vertical-align:top;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:var(--panel2);}
.progress{height:6px;background:var(--panel2);border-radius:3px;overflow:hidden;}
.progress>div{height:100%;background:var(--accent);border-radius:3px;transition:width .4s;}
.empty{text-align:center;color:var(--faint);padding:48px 0;}
.divider{height:1px;background:var(--border);margin:14px 0;}

/* 树 */
.tree{user-select:none;}
.tree-item{display:flex;align-items:center;gap:6px;padding:5px 8px;border-radius:7px;cursor:pointer;font-size:13px;color:var(--muted);}
.tree-item:hover{background:var(--panel2);color:var(--text);}
.tree-item.active{background:var(--accent-soft);color:var(--accent);font-weight:600;}
.tree-item .arrow{width:14px;font-size:10px;color:var(--faint);transition:.15s;text-align:center;flex-shrink:0;}
.tree-item .arrow.open{transform:rotate(90deg);}
.tree-children{margin-left:15px;border-left:1px solid var(--border);padding-left:6px;}
.tree-item .meta{margin-left:auto;font-size:11px;color:var(--faint);}

/* Toast */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);padding:9px 18px;border-radius:9px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:999;box-shadow:var(--shadow);}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ============ 首页 ============ */
.dash-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;}
.course-card{padding:16px;cursor:pointer;transition:.15s;}
.course-card:hover{border-color:var(--accent-border);transform:translateY(-1px);}
.course-card h3{font-size:15px;margin-bottom:4px;}
.course-card .meta{color:var(--muted);font-size:12px;display:flex;gap:8px;flex-wrap:wrap;}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px;}
.stat{padding:14px 16px;}
.stat .num{font-size:22px;font-weight:700;}
.stat .lbl{color:var(--muted);font-size:12px;}
.quick{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px;}

/* ============ 教材浏览 ============ */
.book-layout{display:grid;grid-template-columns:280px 1fr;gap:16px;align-items:start;}
.content-head{padding:18px 20px;border-bottom:1px solid var(--border);}
.content-head h2{font-size:17px;}
.content-head .meta{color:var(--muted);font-size:12.5px;margin-top:4px;display:flex;gap:12px;flex-wrap:wrap;}
.para{padding:12px 20px;border-bottom:1px solid var(--border);display:flex;gap:12px;position:relative;}
.para:hover{background:var(--panel2);}
.para .pno{font-family:var(--mono);font-size:11px;color:var(--faint);flex-shrink:0;padding-top:3px;width:52px;text-align:right;}
.para .ptext{flex:1;}
.para .cite-btn{opacity:0;flex-shrink:0;color:var(--faint);font-size:12px;padding:2px 8px;border-radius:6px;border:1px solid var(--border);}
.para:hover .cite-btn{opacity:1;}
.para .cite-btn:hover{color:var(--accent);border-color:var(--accent);}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;padding:12px 20px;border-bottom:1px solid var(--border);background:var(--panel2);border-radius:var(--radius) var(--radius) 0 0;}

/* ============ 向导 ============ */
.wizard-steps{display:flex;gap:0;margin-bottom:22px;}
.wstep{flex:1;text-align:center;position:relative;padding-top:26px;color:var(--faint);font-size:12.5px;}
.wstep::before{content:attr(data-n);position:absolute;top:0;left:50%;transform:translateX(-50%);width:22px;height:22px;border-radius:50%;background:var(--panel);border:2px solid var(--border-strong);display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:600;z-index:1;}
.wstep::after{content:"";position:absolute;top:11px;left:calc(-50% + 14px);right:calc(50% + 14px);height:2px;background:var(--border-strong);}
.wstep:first-child::after{display:none;}
.wstep.done{color:var(--accent);}.wstep.done::before{background:var(--accent);border-color:var(--accent);color:#fff;}
.wstep.done::after{background:var(--accent);}
.wstep.now{color:var(--accent);font-weight:600;}.wstep.now::before{border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft);}
.wizard-body{max-width:720px;}
.chk{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border:1px solid var(--border);border-radius:9px;margin-bottom:8px;cursor:pointer;transition:.12s;}
.chk:hover{border-color:var(--accent-border);}
.chk.checked{border-color:var(--accent);background:var(--accent-soft);}
.chk input{margin-top:3px;accent-color:var(--accent);}
.chk .t{font-weight:500;}
.chk .d{color:var(--muted);font-size:12px;}
.field-row{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:16px;}
.field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px;}
.qgen{border:1px solid var(--border);border-radius:9px;padding:14px;margin-bottom:10px;}
.qgen .stem{font-weight:500;margin-bottom:8px;}
.qgen .opts{margin-left:8px;color:var(--muted);}
.qgen .ans{margin-top:8px;font-size:12.5px;color:var(--ok);}
.qgen .exp{margin-top:4px;font-size:12.5px;color:var(--muted);}
.qgen .ops{display:flex;gap:6px;margin-top:10px;justify-content:flex-end;}

/* ============ 测验 ============ */
.quiz-top{display:flex;align-items:center;gap:16px;margin-bottom:16px;flex-wrap:wrap;}
.timer{font-family:var(--mono);font-size:20px;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:4px 14px;border-radius:8px;}
.timer.urgent{color:var(--danger);background:var(--danger-soft);}
.qnav{display:flex;gap:6px;flex-wrap:wrap;}
.qnav button{width:30px;height:30px;border-radius:7px;border:1px solid var(--border-strong);font-size:12.5px;color:var(--muted);}
.qnav button.cur{border-color:var(--accent);color:var(--accent);background:var(--accent-soft);font-weight:600;}
.qnav button.done{background:var(--ok-soft);color:var(--ok);border-color:transparent;}
.question-card{padding:22px 24px;margin-bottom:14px;}
.question-card .qhead{display:flex;gap:10px;align-items:center;margin-bottom:12px;}
.question-card .stem{font-size:15px;font-weight:500;margin-bottom:14px;line-height:1.7;}
.opt{display:flex;gap:10px;padding:10px 14px;border:1px solid var(--border);border-radius:9px;margin-bottom:8px;cursor:pointer;transition:.12s;}
.opt:hover{border-color:var(--accent-border);}
.opt.sel{border-color:var(--accent);background:var(--accent-soft);}
.opt .key{width:22px;height:22px;border-radius:50%;border:1px solid var(--border-strong);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--muted);flex-shrink:0;}
.opt.sel .key{background:var(--accent);border-color:var(--accent);color:#fff;}
textarea.answer{width:100%;min-height:130px;resize:vertical;line-height:1.7;}

/* ============ 成绩单 ============ */
.report-grid{display:grid;grid-template-columns:300px 1fr;gap:16px;align-items:start;}
.score-ring{width:150px;height:150px;border-radius:50%;margin:10px auto;display:flex;align-items:center;justify-content:center;flex-direction:column;position:relative;}
.score-ring::before{content:"";position:absolute;inset:12px;background:var(--panel);border-radius:50%;}
.score-ring .big{position:relative;font-size:34px;font-weight:800;}
.score-ring .of{position:relative;color:var(--muted);font-size:12px;}
.radar-wrap{padding:14px;}
.radar{width:100%;max-width:340px;display:block;margin:0 auto;}
.radar-ring{fill:none;stroke:var(--border-strong);stroke-width:1;}
.radar-axis{stroke:var(--border);stroke-width:1;}
.radar-poly{fill:var(--accent);fill-opacity:.22;stroke:var(--accent);stroke-width:2;}
.radar-dot{fill:var(--accent);}
.radar-label{font-size:10.5px;fill:var(--muted);}
.radar-score{font-size:11px;font-weight:700;fill:var(--accent);}
.fb-item{padding:14px 16px;border-bottom:1px solid var(--border);}
.fb-item:last-child{border-bottom:none;}
.fb-head{display:flex;gap:10px;align-items:center;margin-bottom:6px;}
.fb-score{font-weight:700;color:var(--accent);margin-left:auto;font-family:var(--mono);}
.fb-text{font-size:13px;color:var(--muted);}
.fb-text b{color:var(--text);font-weight:600;}

/* ============ 答疑 ============ */
.qa-layout{display:grid;grid-template-columns:250px 1fr;gap:16px;align-items:start;height:calc(100vh - 160px);}
.qa-side{padding:14px;}
.qa-side .field{margin-bottom:14px;}
.qa-side label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;}
.qa-side select{width:100%;}
.qa-main{display:flex;flex-direction:column;height:calc(100vh - 160px);}
.chat{flex:1;overflow-y:auto;padding:18px 20px;}
.msg{display:flex;gap:10px;margin-bottom:18px;max-width:860px;}
.msg .avatar{width:30px;height:30px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px;}
.msg.user .avatar{background:var(--accent-soft);color:var(--accent);}
.msg.ai .avatar{background:var(--ok-soft);color:var(--ok);}
.msg .body{flex:1;}
.msg .name{font-size:12px;color:var(--faint);margin-bottom:3px;}
.bubble{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:11px 14px;line-height:1.75;}
.msg.user .bubble{background:var(--accent-soft);border-color:var(--accent-border);}
.cite{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--accent);background:var(--accent-soft);border:1px solid var(--accent-border);border-radius:6px;padding:1px 7px;margin:2px 3px;cursor:pointer;position:relative;}
.cite .pop{display:none;position:absolute;bottom:calc(100% + 8px);left:0;width:340px;background:var(--panel);border:1px solid var(--border-strong);border-radius:9px;box-shadow:var(--shadow);padding:12px;z-index:20;font-size:12.5px;color:var(--text);line-height:1.7;text-align:left;}
.cite .pop .src{color:var(--faint);font-size:11px;margin-bottom:6px;}
.cite:hover .pop{display:block;}
.composer{border-top:1px solid var(--border);padding:14px 16px;display:flex;gap:10px;align-items:flex-end;}
.composer textarea{flex:1;min-height:44px;max-height:140px;resize:none;line-height:1.6;}
.typing span{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--faint);margin-right:4px;animation:blink 1.2s infinite;}
.typing span:nth-child(2){animation-delay:.2s;}.typing span:nth-child(3){animation-delay:.4s;}
@keyframes blink{0%,60%,100%{opacity:.3}30%{opacity:1}}

/* ============ 模型管理 ============ */
.model-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px;}
.model-card{padding:16px;}
.model-card h4{font-size:14.5px;display:flex;align-items:center;gap:8px;}
.model-card .url{font-family:var(--mono);font-size:11.5px;color:var(--faint);margin:4px 0 10px;word-break:break-all;}
.model-card .caps{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px;}
.model-card .foot{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:10px;padding-top:10px;border-top:1px solid var(--border);}
.model-card .def{margin-left:auto;}

/* ============ 任务中心 ============ */
.task-item{padding:16px 18px;margin-bottom:10px;}
.task-top{display:flex;align-items:center;gap:10px;}
.task-top .name{font-weight:600;}
.task-top .ops{margin-left:auto;display:flex;gap:6px;}
.task-meta{display:flex;gap:14px;color:var(--muted);font-size:12px;margin:8px 0;}
.task-log{margin-top:10px;background:var(--panel2);border-radius:8px;padding:10px 12px;font-family:var(--mono);font-size:11.5px;color:var(--muted);max-height:110px;overflow-y:auto;}
.task-log .ok{color:var(--ok);}.task-log .err{color:var(--danger);}.task-log .warn{color:var(--warn);}

/* ============ 设置 ============ */
.set-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px;align-items:start;}
.set-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border);}
.set-row:last-child{border-bottom:none;}
.set-row .lbl{flex:1;}
.set-row .lbl .t{font-weight:500;}
.set-row .lbl .d{font-size:12px;color:var(--muted);}
.set-row select{min-width:190px;}
.switch{position:relative;width:38px;height:21px;background:var(--border-strong);border-radius:99px;transition:.15s;flex-shrink:0;}
.switch::after{content:"";position:absolute;top:2.5px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.15s;}
.switch.on{background:var(--accent);}
.switch.on::after{left:19px;}

@media (max-width:1100px){.book-layout,.qa-layout,.report-grid{grid-template-columns:1fr;}.rail{width:64px;}.rail-btn span:last-child,.rail-group{display:none;}}
</style>
</head>
<body>

<header class="topbar">
  <div class="logo"><div class="logo-mark">L</div>lumen <span class="tag accent">原型 v1.1</span></div>
  <div class="search">🔍 <input placeholder="搜索教材内容、题目、笔记…"><kbd>⌘K</kbd></div>
  <div class="spacer" style="flex:1"></div>
  <button class="btn btn-ghost btn-sm" id="themeBtn">🌙 深色</button>
  <span class="tag">本地模式 · 127.0.0.1</span>
</header>

<div class="app">
  <nav class="rail" id="rail"></nav>
  <main class="main" id="view"></main>
</div>

<div id="toast"></div>

<script>
/* ================= 样例数据 ================= */
const DB = {
  course: { id:'c1', name:'高等数学（上）', subject:'数学', term:'2026 秋', desc:'同济版教材 + 习题课讲义', created:'2026-09-01' },
  textbooks: [
    { id:'t1', title:'高等数学（第七版·上册）', type:'pdf', pages:248, words:'38 万', status:'parsed', structure:'bookmark' },
    { id:'t2', title:'高等数学习题课讲义', type:'docx', pages:96, words:'12 万', status:'parsed', structure:'styles' },
  ],
  chapters: [
    { id:'ch1', title:'第1章 函数与极限', pages:'p.1-38', words:'5.2 万', children:[

function renderQuiz(){

    </div>`;
  }).join('');

  <div class="quiz-top">
    <h1 style="font-size:17px">⏱️ ${QUIZ.title}</h1>

function isSel(ans,opt){ if(Array.isArray(ans))return ans.includes(opt); return ans===opt; }
function navQ(d){ const ids=QUIZ.questions.map(x=>x.id); const i=ids.indexOf(state.quiz.cur); const n=ids[Math.min(ids.length-1,Math.max(0,i+d))]; state.quiz.cur=n; renderQuiz(); }
function fmtTime(s){ return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); }
function submitQuiz(){
  const q = state.quiz; if(!q||q.submitted) return;
  q.submitted = true; clearInterval(q.timer);
  const obj = QUIZ.questions.filter(x=>x.options.length);
  const objScore = obj.reduce((s,x)=>{ const a=q.answers[x.id]||[]; const ok = Array.isArray(x.answer)?JSON.stringify([...a].sort())===JSON.stringify([...x.answer].sort()):a===x.answer; return ok?s+x.score:s; },0);
  const subj = [ { id:'q4', score:30, max:35, fb:'<b>得分点：</b>① 对任意 ε>0 给出 δ 的取法（15 分，得 13 分）；② 完成 |3x−1−5| = 3|x−2| < ε 的推导（20 分，得 17 分）。<br><b>扣分原因：</b>未明确说明"取 δ = ε/3"这一步骤的合理性，仅写出结果。<br><b>改进建议：</b>证明题应先"给 ε → 找 δ"，再"验证 δ 满足定义"，两段式书写更清晰。' },
                 { id:'q5', score:28, max:35, fb:'<b>得分点：</b>① 导数是变化率、微分是线性主部（15 分，得 12 分）；② 几何意义：切线斜率 vs 切线纵坐标增量（20 分，得 16 分）。<br><b>扣分原因：</b>未给出具体函数示例（如 y=x² 在 x=1 处的切线），说明不够完整。<br><b>改进建议：</b>概念关系题建议"定义 → 关系式 dy = f′(x)dx → 几何图示 → 举例"四步作答。' } ];
  const subjScore = subj.reduce((s,x)=>s+x.score,0);
  state.result = { total:objScore+subjScore, objScore, subjScore, left:q.left, answers:q.answers, subj,
    radar:[ {name:'函数与极限',value:82},{name:'导数与微分',value:88},{name:'中值定理',value:64},{name:'不定积分',value:76},{name:'定积分',value:71} ] };
  toast('答卷已提交，客观题已判分，主观题 AI 阅卷中…');
  setTimeout(()=>{ go('report'); toast('AI 阅卷完成 ✓ 成绩单已生成') },900);
}

/* ================= 成绩单 ================= */
function radarSVG(data,size){
  size=size||320; const cx=size/2, cy=size/2+8, r=size/2-52, n=data.length;
  const pt=(i,v)=>{ const a=-Math.PI/2+i*2*Math.PI/n, rr=r*v/100; return [cx+rr*Math.cos(a), cy+rr*Math.sin(a)]; };
  let s='';
  [25,50,75,100].forEach(v=>{ s+=`<polygon class="radar-ring" points="${data.map((_,i)=>pt(i,v).join(',')).join(' ')}"/>`; });
  data.forEach((d,i)=>{ const [x,y]=pt(i,100); s+=`<line class="radar-axis" x1="${cx}" y1="${cy}" x2="${x}" y2="${y}"/>`;
    const [lx,ly]=pt(i,122); s+=`<text class="radar-label" x="${lx}" y="${ly}" text-anchor="middle">${d.name}</text><text class="radar-score" x="${lx}" y="${ly+14}" text-anchor="middle">${d.value}</text>`; });
  s+=`<polygon class="radar-poly" points="${data.map((d,i)=>pt(i,d.value).join(',')).join(' ')}"/>`;
  data.forEach((d,i)=>{ const [x,y]=pt(i,d.value); s+=`<circle class="radar-dot" cx="${x}" cy="${y}" r="3.5"/>`; });
  return `<svg class="radar" viewBox="0 0 ${size} ${size}">${s}</svg>`;
}

  const circumference = 2*Math.PI*64;
  const fb = QUIZ.questions.map((q,i)=>{

    if(q.options.length){

  $('#qaInput').onkeydown=e=>{ if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendQA();} };
}
function citeHTML(x){ return `<span class="cite">📎 ${x.b} ${x.p}<span class="pop"><div class="src">原文片段 · ${x.b} · ${x.p}</div>${esc(x.q)}</span></span>`; }
function sendQA(){
  const inp=$('#qaInput'); const text=inp.value.trim(); if(!text||state.chat.streaming) return;
  state.chat.msgs.push({role:'user',text}); inp.value='';
  state.chat.streaming=true; renderQA();
  setTimeout(()=>{
    state.chat.streaming=false;
    const replies=[
      { text:'在 §1.3 中，极限的 ε-δ 定义是：对于任意给定的正数 ε，总存在正数 δ，使得当 0 < |x − x₀| < δ 时，|f(x) − A| < ε 成立', cites:[{b:'《高等数学（上）》第1章 §1.3',p:'p.21¶1',q:'设函数 f(x) 在点 x₀ 的某一去心邻域内有定义…总存在正数 δ，使得当 x 满足不等式 0 < |x − x₀| < δ 时，对应的函数值 f(x) 都满足不等式 |f(x) − A| < ε'}], tail:'。直观理解：x 越接近 x₀，f(x) 就越接近 A。' },
      { text:'教材未覆盖该问题的完整证明，但根据 §1.4 的连续性定义可以推导：若 f 在 x₀ 连续，则 lim(x→x₀) f(x) = f(x₀)', cites:[{b:'《高等数学（上）》第1章 §1.4',p:'p.24¶1',q:'设函数 y = f(x) 在点 x₀ 的某一邻域内有定义，如果 lim(x→x₀) f(x) = f(x₀)，则称 f(x) 在点 x₀ 连续'}], tail:'。（声明：推导部分超出教材原文，已标注。）' },
    ];
    state.chat.msgs.push({...replies[Math.floor(Math.random()*replies.length)]});
    renderQA();
  },700);
}

      <div class="ops">${t.status==='running'?`<button class="btn btn-sm btn-danger" onclick="toast('已取消任务（原型）')">取消</button>`:t.status==='failed'?`<button class="btn btn-sm" onclick="toast('正在重试，将切换备用模型…')">⟳ 重试</button>`:''}</div>

    <div class="progress"><div style="width:${t.progress}%"></div></div>
    <div class="task-meta"><span>类型：${t.type}</span><span>${t.time}</span><span>${t.cost}</span><span>${t.progress}%</span></div>

}

}
